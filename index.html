
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>シンプルTo-Doリスト</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #2c3e50, #4ca1af);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background-color: rgba(255, 255, 255, 0.1);
      padding: 2rem;
      border-radius: 1rem;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 4px 30px rgba(0,0,0,0.1);
      backdrop-filter: blur(10px);
    }
    h1 {
      text-align: center;
      margin-bottom: 1rem;
      font-weight: 700;
      color: #fff;
    }
    input[type="text"] {
      width: 100%;
      padding: 1rem;
      border-radius: 0.5rem;
      border: none;
      margin-bottom: 1rem;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      border: none;
      border-radius: 0.5rem;
      background: #16a085;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    button:hover {
      transform: scale(1.05);
    }
    ul {
      list-style-type: none;
      padding: 0;
    }
    li {
      background-color: rgba(255, 255, 255, 0.2);
      padding: 0.75rem;
      margin-bottom: 0.5rem;
      border-radius: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: fadeIn 0.3s ease-in-out;
    }
    li.completed span {
      text-decoration: line-through;
      opacity: 0.6;
    }
    .delete {
      background: #e74c3c;
      color: #fff;
      border: none;
      border-radius: 0.25rem;
      padding: 0.25rem 0.5rem;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .delete:hover {
      transform: scale(1.1);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>To-Do List</h1>
    <input type="text" id="taskInput" placeholder="タスクを入力...">
    <button onclick="addTask()">追加</button>
    <ul id="taskList"></ul>
  </div>
  <script>
    const taskInput = document.getElementById('taskInput');
    const taskList = document.getElementById('taskList');

    document.addEventListener('DOMContentLoaded', loadTasks);

    function addTask() {
      const taskText = taskInput.value.trim();
      if (taskText === '') return;
      const task = { text: taskText, completed: false };
      const tasks = getTasks();
      tasks.push(task);
      saveTasks(tasks);
      renderTask(task);
      taskInput.value = '';
    }

    function renderTask(task, index = null) {
      const li = document.createElement('li');
      if (task.completed) li.classList.add('completed');

      const span = document.createElement('span');
      span.textContent = task.text;
      span.style.cursor = 'pointer';
      span.onclick = () => toggleTask(span);

      const delBtn = document.createElement('button');
      delBtn.textContent = '削除';
      delBtn.className = 'delete';
      delBtn.onclick = () => deleteTask(li);

      li.appendChild(span);
      li.appendChild(delBtn);
      taskList.appendChild(li);
    }

    function toggleTask(span) {
      const li = span.parentElement;
      li.classList.toggle('completed');
      const tasks = getTasks();
      const index = Array.from(taskList.children).indexOf(li);
      tasks[index].completed = li.classList.contains('completed');
      saveTasks(tasks);
    }

    function deleteTask(li) {
      li.classList.add('fadeOut');
      const index = Array.from(taskList.children).indexOf(li);
      setTimeout(() => {
        const tasks = getTasks();
        tasks.splice(index, 1);
        saveTasks(tasks);
        li.remove();
      }, 200);
    }

    function getTasks() {
      return JSON.parse(localStorage.getItem('tasks') || '[]');
    }

    function saveTasks(tasks) {
      localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    function loadTasks() {
      const tasks = getTasks();
      tasks.forEach(task => renderTask(task));
    }
  </script>
</body>
</html>
