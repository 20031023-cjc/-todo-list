<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>シンプルTo-Doリスト</title>
  <style>
    /* Reset */
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f7fa;
      color: #333;
      max-width: 480px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h1 {
      text-align: center;
      color: #4a90e2;
      margin-bottom: 20px;
    }
    .todo-container {
      background: #fff;
      padding: 30px 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(74, 144, 226, 0.2);
    }
    form {
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 15px;
      border: 2px solid #4a90e2;
      border-radius: 6px;
      font-size: 16px;
      transition: border-color 0.3s ease;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #2e66c7;
    }
    button {
      background: #4a90e2;
      border: none;
      color: white;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      user-select: none;
    }
    button:hover {
      background: #2e66c7;
    }
    ul {
      list-style: none;
      margin-top: 25px;
      padding: 0;
      max-height: 300px;
      overflow-y: auto;
    }
    li {
      background: #f0f4ff;
      padding: 12px 15px;
      margin-bottom: 12px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      color: #333;
      transition: background-color 0.3s ease;
      cursor: pointer;
      user-select: none;
    }
    li.completed {
      text-decoration: line-through;
      color: #999;
      background: #d9e2ff;
    }
    li:hover {
      background: #d0dfff;
    }
    .delete-btn {
      background: #e74c3c;
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      user-select: none;
    }
    .delete-btn:hover {
      background: #c0392b;
    }
    /* スクロールバー */
    ul::-webkit-scrollbar {
      width: 8px;
    }
    ul::-webkit-scrollbar-thumb {
      background-color: #4a90e2;
      border-radius: 4px;
    }
    ul::-webkit-scrollbar-track {
      background: #f5f7fa;
    }
  </style>
</head>
<body>
  <h1>シンプルTo-Doリスト</h1>
  <div class="todo-container">
    <form id="todoForm" autocomplete="off">
      <input type="text" id="todoInput" placeholder="タスクを入力してください" />
      <button type="submit">追加</button>
    </form>
    <ul id="todoList"></ul>
  </div>

  <script>
    const todoForm = document.getElementById('todoForm');
    const todoInput = document.getElementById('todoInput');
    const todoList = document.getElementById('todoList');

    // タスクの追加
    todoForm.addEventListener('submit', e => {
      e.preventDefault();
      const taskText = todoInput.value.trim();
      if (taskText === '') return;

      // li要素の作成
      const li = document.createElement('li');
      li.textContent = taskText;

      // タスク完了のトグル
      li.addEventListener('click', () => {
        li.classList.toggle('completed');
      });

      // 削除ボタンの作成
      const delBtn = document.createElement('button');
      delBtn.textContent = '削除';
      delBtn.className = 'delete-btn';

      delBtn.addEventListener('click', e => {
        e.stopPropagation(); // 親のliクリックイベントを防止
        todoList.removeChild(li);
      });

      li.appendChild(delBtn);
      todoList.appendChild(li);

      // 入力欄をクリア
      todoInput.value = '';
      todoInput.focus();
    });
  </script>
</body>
</html>
