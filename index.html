<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>シンプルTo-Doリスト</title>
  <style>
    /* 省略，为了简洁，你可以用之前给你的样式 */
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f7fa;
      color: #333;
      max-width: 480px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h1 {
      text-align: center;
      color: #4a90e2;
      margin-bottom: 20px;
    }
    .todo-container {
      background: #fff;
      padding: 30px 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(74, 144, 226, 0.2);
    }
    form {
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 15px;
      border: 2px solid #4a90e2;
      border-radius: 6px;
      font-size: 16px;
      transition: border-color 0.3s ease;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #2e66c7;
    }
    button {
      background: #4a90e2;
      border: none;
      color: white;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      user-select: none;
    }
    button:hover {
      background: #2e66c7;
    }
    ul {
      list-style: none;
      margin-top: 25px;
      padding: 0;
      max-height: 300px;
      overflow-y: auto;
    }
    li {
      background: #f0f4ff;
      padding: 12px 15px;
      margin-bottom: 12px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      color: #333;
      transition: background-color 0.3s ease;
      cursor: pointer;
      user-select: none;
    }
    li.completed {
      text-decoration: line-through;
      color: #999;
      background: #d9e2ff;
    }
    li:hover {
      background: #d0dfff;
    }
    .delete-btn {
      background: #e74c3c;
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      user-select: none;
    }
    .delete-btn:hover {
      background: #c0392b;
    }
  </style>
</head>
<body>
  <h1>シンプルTo-Doリスト（保存機能付き）</h1>
  <div class="todo-container">
    <form id="todoForm" autocomplete="off">
      <input type="text" id="todoInput" placeholder="タスクを入力してください" />
      <button type="submit">追加</button>
    </form>
    <ul id="todoList"></ul>
  </div>

  <script>
    const todoForm = document.getElementById('todoForm');
    const todoInput = document.getElementById('todoInput');
    const todoList = document.getElementById('todoList');

    // localStorageからデータを取得し、画面に反映する関数
    function loadTodos() {
      const todos = JSON.parse(localStorage.getItem('todos')) || [];
      todos.forEach(todo => {
        addTodoItem(todo.text, todo.completed);
      });
    }

    // To-Doアイテムを画面に追加する関数
    function addTodoItem(text, completed = false) {
      const li = document.createElement('li');
      li.textContent = text;
      if (completed) li.classList.add('completed');

      // クリックで完了・未完了切り替え
      li.addEventListener('click', () => {
        li.classList.toggle('completed');
        saveTodos();
      });

      // 削除ボタン
      const delBtn = document.createElement('button');
      delBtn.textContent = '削除';
      delBtn.className = 'delete-btn';
      delBtn.addEventListener('click', e => {
        e.stopPropagation();
        todoList.removeChild(li);
        saveTodos();
      });

      li.appendChild(delBtn);
      todoList.appendChild(li);
    }

    // localStorageに現在のTo-Doリストを保存する関数
    function saveTodos() {
      const items = [];
      todoList.querySelectorAll('li').forEach(li => {
        items.push({
          text: li.firstChild.textContent, // liのテキスト部分
          completed: li.classList.contains('completed'),
        });
      });
      localStorage.setItem('todos', JSON.stringify(items));
    }

    // フォーム送信（追加）イベント
    todoForm.addEventListener('submit', e => {
      e.preventDefault();
      const taskText = todoInput.value.trim();
      if (!taskText) return;
      addTodoItem(taskText);
      saveTodos();
      todoInput.value = '';
      todoInput.focus();
    });

    // 初回ロード時に保存済みタスクを読み込み
    loadTodos();
  </script>
</body>
</html>
